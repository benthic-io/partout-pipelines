location = /parts/NHTSA {
    return 301 /parts/NHTSA/;
}

location = /parts/NHTSA/reference {
    return 301 /parts/NHTSA/reference/;
}

location ^~ /parts/NHTSA/reference/ {
    proxy_pass http://127.0.0.1:3005/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Accept-Profile api_reference;
    proxy_set_header Content-Profile api_reference;
}

location ^~ /parts/NHTSA/ {
    proxy_pass http://127.0.0.1:3005/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Accept-Profile vpic;
    proxy_set_header Content-Profile vpic;
}
