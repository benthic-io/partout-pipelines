[paths]
root = "/raid_0/partout"
archives = "archives"
work = "work"
logs = "logs"
state = "state"
bdp_output = "bdp"

[database]
host = "localhost"
port = 5432
name = "partout_nhtsa"
user = "postgres"
maintenance_db = "postgres"

[database.roles]
api_role = "api_user"
anon_role = "web_anon"

[database.targets]
nhtsa = "partout_nhtsa"

[api]
base_url = "https://vpic.nhtsa.dot.gov/api"
request_interval_seconds = 1.0
timeout_seconds = 120.0
max_attempts = 5
backoff_seconds = 2.0
max_backoff_seconds = 300.0
max_retry_after_seconds = 3600.0
user_agent = "benthic-partout-pipelines/0.1"
all_models_csv_url = "https://vpic.nhtsa.dot.gov/api/vehicles/GetModelsForMake/*?format=csv"
equipment_year = 2026
equipment_types = [1, 3, 13, 16]

[postgrest]
base_url = "https://benthic.io/parts/NHTSA"
port = 3005
api_role = "api_user"
anon_role = "web_anon"
schemas = ["vpic", "api_reference"]

[postgrest.ports]
nhtsa = 3005

[bdp]
author_identity = "brian@benthic.io"
collection = "parts"
repository_url = "https://github.com/benthic-io/partout-pipelines"

[sources.vpic]
url = "https://vpic.nhtsa.dot.gov/api"
archive_url = "https://vpic.nhtsa.dot.gov/downloads/vPICList_lite_2026_09.plain.zip"
archive_filename = "vPICList_lite_2026_09.plain.zip"
archive_sha256 = "1ee4a1e22526a606b492ce4ab301894465afbf43dc00946df6d503c3102d5911"
