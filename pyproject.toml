[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partout-pipelines"
version = "0.1.0"
description = "Resumable NHTSA/vPIC reference-data pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "psycopg2>=2.9",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://benthic.io/parts/NHTSA/"
Repository = "https://github.com/benthic-io/partout-pipelines"
BDP = "https://benthic.io/bdp/"

[project.scripts]
partout = "partout_pipelines.cli:main"
parts-pipelines = "partout_pipelines.cli:main"

[tool.setuptools]
packages = [
  "partout_pipelines",
  "pipelines",
  "pipelines.nhtsa",
]

[tool.setuptools.package-dir]
partout_pipelines = "src/partout_pipelines"
pipelines = "pipelines"
"pipelines.nhtsa" = "pipelines/nhtsa"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "SIM", "UP"]
ignore = ["SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
