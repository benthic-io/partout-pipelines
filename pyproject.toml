[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parts-pipelines"
version = "0.1.0"
description = "Resumable NHTSA/vPIC reference importers"
requires-python = ">=3.11"
dependencies = [
  "psycopg2>=2.9",
  "requests>=2.31",
]

[project.scripts]
parts-pipelines = "parts_pipelines.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "SIM", "UP"]
ignore = ["SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
